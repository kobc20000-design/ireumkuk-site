name: 사이트 데이터 15분마다 갱신

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ireumkuk-site 체크아웃
        uses: actions/checkout@v4
        with:
          path: ireumkuk-site

      - name: apply 체크아웃
        uses: actions/checkout@v4
        with:
          repository: kobc20000-design/apply
          path: apply
          token: ${{ secrets.APPLY_PUSH_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests python-dotenv

      - name: 신규 공고 알림 카드 발행 (notify_bot.py)
        working-directory: apply
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}/ireumkuk-site
        run: python notify_bot.py

      - name: 사이트 데이터 빌드 + 배포 (build_site.py)
        working-directory: apply
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}/ireumkuk-site
        run: python build_site.py --push

      - name: apply 상태 파일(pending/seen) 커밋
        working-directory: apply
        run: |
          git -c user.email=kobc20000@gmail.com -c user.name=이름콕 add pending_announcements.json seen_announcements.json
          git -c user.email=kobc20000@gmail.com -c user.name=이름콕 commit -m "notify_bot 상태 갱신" || echo "변경 없음"
          git push

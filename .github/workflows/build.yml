name: 사이트 데이터 15분마다 갱신

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 (notify_bot + auto_analyze + build_site)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ireumkuk-site 체크아웃
        uses: actions/checkout@v4
        with:
          path: ireumkuk-site

      - name: apply 체크아웃
        uses: actions/checkout@v4
        with:
          repository: kobc20000-design/apply
          path: apply
          token: ${{ secrets.APPLY_PUSH_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests python-dotenv

      - name: 신규 공고 알림 카드 발행 (notify_bot.py)
        working-directory: apply
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}/ireumkuk-site
        run: python notify_bot.py

      - name: 분석용 의존성 설치
        run: pip install pdfplumber pypdf google-generativeai

      - name: 신규 공고 자동 분석 (auto_analyze.py)
        working-directory: apply
        continue-on-error: true   # GEMINI_API_KEY 미설정 등으로 실패해도 사이트 빌드는 계속
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}/ireumkuk-site
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          EMAIL_NOTIFY_TO: ${{ secrets.EMAIL_NOTIFY_TO }}
        run: python auto_analyze.py --days 7 --limit 5

      - name: 사이트 데이터 빌드 + 배포 (build_site.py)
        working-directory: apply
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}/ireumkuk-site
        run: python build_site.py --push

      - name: apply 상태 파일 커밋 (pending/seen/analyzed + 분석 결과)
        working-directory: apply
        run: |
          git -c user.email=kobc20000@gmail.com -c user.name=청약콕 add -A pending_announcements.json seen_announcements.json analyzed_announcements.json auto_analyzed
          git -c user.email=kobc20000@gmail.com -c user.name=청약콕 commit -m "자동: 공고 상태 + 분석 결과 갱신" || echo "변경 없음"
          git push
